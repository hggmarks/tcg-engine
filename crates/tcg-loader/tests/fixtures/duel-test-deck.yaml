      - { card: ash_sprite,    count: 3 }
      - { card: pebble_golem,  count: 3 }
      - { card: reed_stalker,  count: 3 }
      - { card: ember_fox,     count: 3 }
      - { card: tide_scribe,   count: 3 }
      - { card: iron_beetle,   count: 3 }
      - { card: gale_hawk,     count: 3 }
      - { card: cinder_ogre,   count: 3 }
      - { card: frost_warden,  count: 3 }
      - { card: thorn_knight,  count: 3 }
      - { card: quarry_bear,   count: 1 }
