# A small ruleset for the phase and count tests (ticket #97, ADR-0042): two Players, one card type
# and a Turn with two action phases. Main lists `summon`, `to_battle` and `end_turn`; Battle lists
# `strike`, `raid` and `end_turn`. `between` and `end` are automatic phases with a step that shows in
# the Events. The tests edit single lines of this text to make each load error. Format:
# rulesets/formats.md.
meta: { id: phases, version: 1 }

parameters:
  players: 2
  starting_player: 0

zones:
  - { id: deck,  visibility: hidden, ordered: true }
  - { id: hand,  visibility: owner,  ordered: false }
  - { id: field, visibility: public, ordered: false }

card_types:
  - id: unit
    fields:
      - { name: name,  type: text }
      - { name: power, type: int }
    instance_state: []
    effects: true

inputs:
  - { id: main_deck, card_types: [unit], size: 6, max_copies: 6, zone: deck }

player_state:
  - { id: life_points, type: int, init: 4000 }
  - { id: turns_ended, type: int, init: 0 }   # how many Turns the Player has seen to their End phase

setup:
  - draw: { player: each, from: deck, to: hand, count: 3 }

turn:
  phases:
    - id: first
      automatic: []
    - id: main
      actions: [summon, to_battle, end_turn]
    - id: between
      automatic:
        - draw: { player: active, from: deck, to: hand, count: 1 }
    - id: battle
      actions: [strike, raid, end_turn]
    - id: end
      automatic:
        - add_state: { player: active, state: turns_ended, amount: 1 }

actions:
  # Legal while the acting Player has at most 1 card in the field: a `where` reading `count`.
  - id: summon
    params:
      - name: card
        zone: hand
        card_type: unit
        where: { lte: [{ count: { zone: field, player: active } }, 1] }
    effects:
      - move: { card: { ref: card }, to: field }

  - id: to_battle
    effects: [ { advance_phase: {} } ]

  # Not on the Game's first Turn: a `where` reading `first_turn`.
  - id: strike
    params:
      - name: card
        zone: field
        card_type: unit
        where: { eq: [{ first_turn: {} }, false] }
    effects:
      - add_state: { player: opponent, state: life_points, amount: -100 }

  # Only while the opponent has no card in the field: `count` of the opponent's zone.
  - id: raid
    params:
      - name: card
        zone: field
        card_type: unit
        where: { eq: [{ count: { zone: field, player: opponent } }, 0] }
    effects:
      - add_state: { player: opponent, state: life_points, amount: -50 }

  - id: end_turn
    effects: [ { end_turn: {} } ]

effects:
  active_zone: field
