[package]
name = "tcg-loader"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tcg-engine = { path = "../.." }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
serde_path_to_error = "=0.1.20"
