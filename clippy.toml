    { path = "std::thread::spawn", reason = "threads are nondeterministic" },
    { path = "std::thread::Builder::spawn", reason = "threads are nondeterministic" },
    { path = "std::thread::scope", reason = "threads are nondeterministic" },
    { path = "std::env::var", reason = "the environment is not part of the GameState" },
    { path = "std::env::var_os", reason = "the environment is not part of the GameState" },
    { path = "std::env::vars", reason = "the environment is not part of the GameState" },
    { path = "std::env::vars_os", reason = "the environment is not part of the GameState" },
    { path = "std::env::args", reason = "the environment is not part of the GameState" },
    { path = "std::env::args_os", reason = "the environment is not part of the GameState" },
    { path = "std::env::current_dir", reason = "the environment is not part of the GameState" },
    { path = "std::env::temp_dir", reason = "the environment is not part of the GameState" },
]
