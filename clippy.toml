disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is nondeterministic; use BTreeMap or a Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is nondeterministic; use BTreeSet or a Vec" },
]

