      - { card: frost_warden, count: 2 }
      - { card: quarry_bear, count: 2 }
      - { card: cinder_ogre, count: 3 }
      - { card: thorn_knight, count: 2 }
      - { card: obsidian_golem, count: 2 }
      - { card: dune_wyrm, count: 2 }
      - { card: ashen_minotaur, count: 1 }
