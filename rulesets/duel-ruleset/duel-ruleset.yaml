# The Duel Ruleset v3 (tickets [39] to [42] of the Phase G roadmap): a face-up duel between two
# Players, each with Life Points and a deck of monsters and spells, with a Main and a Battle phase,
# monster positions, combat between monsters, tribute summons and normal spells. Spec:
# duel-ruleset.md. Format: ../formats.md.
meta: { id: duel, version: 4 }

parameters:
  players: 2
  starting_player: 0

zones:
  - { id: deck,         visibility: hidden, ordered: true }
  - { id: hand,         visibility: owner,  ordered: false }
  - { id: graveyard,    visibility: public, ordered: true }   # the top is the last card
  - { id: monster_zone, visibility: public, ordered: false }
  - { id: spell_trap_zone, visibility: public, ordered: false }   # holds a spell while it resolves (ADR-0044)

card_types:
  - id: monster
    fields:
      - { name: name,  type: text }
      - { name: level, type: int }
      - { name: atk,   type: int }
      - { name: def,   type: int }
    instance_state:
      - { name: attacked, type: bool, init: false }
      # "attack" or "defence", face-up this phase (ADR-0043). A monster enters in the position its
      # summon or set gives; the init is the position of a card that has not arrived.
      - { name: position, type: text, init: "attack" }
      # Whether the monster arrived or changed position this Turn: it may not change position then.
      - { name: position_fixed, type: bool, init: false }
    effects: false
  # A normal spell (ADR-0044): its Card Effect acts while it is in the Spell/Trap Zone.
  - id: spell
    fields:
      - { name: name, type: text }
    instance_state: []
    effects: true

# Where Card Effects act: a spell's `enter` trigger fires on arrival in the Spell/Trap Zone
# (ADR-0044). Monsters carry no Card Effect until Phase H, which may revisit this.
effects:
  active_zone: spell_trap_zone

# Values every Player holds (ADR-0041). The engine names none: Life Points are this ruleset's.
player_state:
  - { id: life_points,     type: int,  init: 4000 }
  - { id: normal_summoned, type: bool, init: false }   # whether the Player made their Normal Summon, Set, Tribute Summon or Tribute Set this Turn

inputs:
  - { id: main_deck, card_types: [monster, spell], size: 40, max_copies: 3, zone: deck }

setup:
  - shuffle: { player: each, zone: deck }
  - draw: { player: each, from: deck, to: hand, count: 5 }

# Draw (automatic), Main and Battle (the two phases with actions), End (automatic). `to_battle` moves
# from Main to Battle. Ending the Turn from either runs End and begins the next Player's Turn in the
# same transition.
turn:
  phases:
    - id: draw
      automatic:
        # The starting Player does not draw on the Game's first Turn.
        - if: { first_turn: {} }
          then: []
          else:
            - draw: { player: active, from: deck, to: hand, count: 1 }
    - id: main
      actions:
        - normal_summon
        - set_monster
        - tribute_summon_one
        - tribute_summon_two
        - tribute_set_one
        - tribute_set_two
        - play_spell
        - change_position
        - to_battle
        - end_turn
    - id: battle
      actions: [attack, direct_attack, end_turn]
    - id: end
      automatic:
        # The Player's Turn is over: they may summon again, and their monsters may attack again and
        # change position again.
        - set_state: { player: active, state: normal_summoned, value: false }
        - set_state: { player: active, zone: monster_zone, state: attacked, value: false }
        - set_state: { player: active, zone: monster_zone, state: position_fixed, value: false }

actions:
  # A monster of level 1 to 4 goes from the hand to the Monster Zone in attack position, once per
  # Turn, while the Monster Zone holds at most 2 monsters (so it holds 3 at most).
  - id: normal_summon
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 1] }
            - { lte: [{ ref: card.level }, 4] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            - { lte: [{ count: { zone: monster_zone, player: active } }, 2] }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "attack" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  # The same as a Normal Summon, in defence position: it shares the once-per-Turn flag and the
  # Monster Zone's room. The set monster is face-up and public until Phase H.
  - id: set_monster
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 1] }
            - { lte: [{ ref: card.level }, 4] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            - { lte: [{ count: { zone: monster_zone, player: active } }, 2] }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "defence" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  # Tribute summons (ADR-0044): a monster of level 5 or 6 needs 1 tribute, one of level 7 or more
  # needs 2, written as separate actions whose `where` reads the level. A tribute is a monster of the
  # acting Player's Monster Zone and goes to the Graveyard as the cost, in param order. A param
  # `where` runs before the costs (ADR-0016), so "the capacity after the tributes leave" is the
  # arithmetic `count - N <= 2`: a summon with 2 tributes from a full Monster Zone is legal. The
  # tribute params are distinct cards (ADR-0044), and the once-per-Turn flag is the Normal Summon's.
  - id: tribute_summon_one
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 5] }
            - { lte: [{ ref: card.level }, 6] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            # States the rule: the tributes are 1 of the Monster Zone's at most 3 monsters, so this cannot fail
            # in today's play (it matters if the zone could ever hold more than 3).
            - { lte: [{ sub: [{ count: { zone: monster_zone, player: active } }, 1] }, 2] }
      - { name: tribute, zone: monster_zone, card_type: monster }
    cost:
      - move: { card: { ref: tribute }, to: graveyard }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "attack" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  - id: tribute_summon_two
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 7] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            # States the rule: the tributes are 2 of the Monster Zone's at most 3 monsters, so this cannot fail
            # in today's play (it matters if the zone could ever hold more than 3).
            - { lte: [{ sub: [{ count: { zone: monster_zone, player: active } }, 2] }, 2] }
      - { name: tribute_1, zone: monster_zone, card_type: monster }
      - { name: tribute_2, zone: monster_zone, card_type: monster }
    cost:
      - move: { card: { ref: tribute_1 }, to: graveyard }
      - move: { card: { ref: tribute_2 }, to: graveyard }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "attack" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  # The same two, in defence position: the monster is set (face-up and public until Phase H).
  - id: tribute_set_one
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 5] }
            - { lte: [{ ref: card.level }, 6] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            # States the rule: the tributes are 1 of the Monster Zone's at most 3 monsters, so this cannot fail
            # in today's play (it matters if the zone could ever hold more than 3).
            - { lte: [{ sub: [{ count: { zone: monster_zone, player: active } }, 1] }, 2] }
      - { name: tribute, zone: monster_zone, card_type: monster }
    cost:
      - move: { card: { ref: tribute }, to: graveyard }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "defence" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  - id: tribute_set_two
    params:
      - name: card
        zone: hand
        card_type: monster
        where:
          and:
            - { gte: [{ ref: card.level }, 7] }
            - { eq: [{ ref: player.normal_summoned, player: active }, false] }
            # States the rule: the tributes are 2 of the Monster Zone's at most 3 monsters, so this cannot fail
            # in today's play (it matters if the zone could ever hold more than 3).
            - { lte: [{ sub: [{ count: { zone: monster_zone, player: active } }, 2] }, 2] }
      - { name: tribute_1, zone: monster_zone, card_type: monster }
      - { name: tribute_2, zone: monster_zone, card_type: monster }
    cost:
      - move: { card: { ref: tribute_1 }, to: graveyard }
      - move: { card: { ref: tribute_2 }, to: graveyard }
    effects:
      - move: { card: { ref: card }, to: monster_zone }
      - set_state: { player: active, state: normal_summoned, value: true }
      - set_state: { card: { ref: card }, state: position, value: "defence" }
      - set_state: { card: { ref: card }, state: position_fixed, value: true }

  # A normal spell from the hand, while the Spell/Trap Zone holds at most 2 (so it holds 3 at most).
  # The cost moves it to the Spell/Trap Zone; its own `enter` trigger sends it to the Graveyard and
  # does its effect (ADR-0044). It is listed in Main only.
  - id: play_spell
    params:
      - name: card
        zone: hand
        card_type: spell
        # States the rule: a spell leaves the Spell/Trap Zone in the transition that plays it, so the zone
        # is empty whenever this is read and the clause cannot fail in today's play.
        where: { lte: [{ count: { zone: spell_trap_zone, player: active } }, 2] }
    cost:
      - move: { card: { ref: card }, to: spell_trap_zone }
    effects: []

  # A monster of the acting Player's Monster Zone that did not arrive or change position this Turn
  # goes to the other position.
  - id: change_position
    params:
      - name: monster
        zone: monster_zone
        card_type: monster
        where: { eq: [{ ref: monster.position_fixed }, false] }
    effects:
      - set_state: { card: { ref: monster }, state: position_fixed, value: true }
      - if: { eq: [{ ref: monster.position }, "attack"] }
        then:
          - set_state: { card: { ref: monster }, state: position, value: "defence" }
        else:
          - set_state: { card: { ref: monster }, state: position, value: "attack" }

  - id: to_battle
    effects: [ { advance_phase: {} } ]

  # An attack-position monster of the acting Player's Monster Zone that has not attacked this Turn
  # attacks a monster of the opponent's Monster Zone, never on the Game's first Turn (no opponent
  # monster can exist then, so the clause states the rule rather than filters). Damage comes before
  # destruction in each branch. Against an attack-position target the lower ATK is destroyed and its
  # owner loses the difference (the `sub` is negative); a tie destroys both, no damage. Against
  # a defence-position target ATK above DEF destroys it, ATK below DEF costs the attacker's
  # owner the difference, equal changes nothing.
  - id: attack
    params:
      - name: attacker
        zone: monster_zone
        card_type: monster
        where:
          and:
            - { eq: [{ ref: attacker.attacked }, false] }
            - { eq: [{ ref: attacker.position }, "attack"] }
            - { eq: [{ first_turn: {} }, false] }
      - { name: target, owner: opponent, zone: monster_zone, card_type: monster }
    effects:
      - set_state: { card: { ref: attacker }, state: attacked, value: true }
      - if: { eq: [{ ref: target.position }, "attack"] }
        then:
          - if: { gt: [{ ref: attacker.atk }, { ref: target.atk }] }
            then:
              - add_state: { player: opponent, state: life_points, amount: { sub: [{ ref: target.atk }, { ref: attacker.atk }] } }
              - move: { card: { ref: target }, to: graveyard }
            else:
              - if: { lt: [{ ref: attacker.atk }, { ref: target.atk }] }
                then:
                  - add_state: { player: active, state: life_points, amount: { sub: [{ ref: attacker.atk }, { ref: target.atk }] } }
                  - move: { card: { ref: attacker }, to: graveyard }
                else:
                  - move: { card: { ref: target }, to: graveyard }
                  - move: { card: { ref: attacker }, to: graveyard }
        else:
          - if: { gt: [{ ref: attacker.atk }, { ref: target.def }] }
            then:
              - move: { card: { ref: target }, to: graveyard }
            else:
              - if: { lt: [{ ref: attacker.atk }, { ref: target.def }] }
                then:
                  - add_state: { player: active, state: life_points, amount: { sub: [{ ref: attacker.atk }, { ref: target.def }] } }

  # An attack-position monster of the acting Player's Monster Zone that has not attacked this Turn
  # hits the opponent for its ATK, when the opponent has no monster and it is not the Game's first
  # Turn.
  - id: direct_attack
    params:
      - name: attacker
        zone: monster_zone
        card_type: monster
        where:
          and:
            - { eq: [{ ref: attacker.attacked }, false] }
            - { eq: [{ ref: attacker.position }, "attack"] }
            - { eq: [{ count: { zone: monster_zone, player: opponent } }, 0] }
            - { eq: [{ first_turn: {} }, false] }
    effects:
      - set_state: { card: { ref: attacker }, state: attacked, value: true }
      - add_state: { player: opponent, state: life_points, amount: { sub: [0, { ref: attacker.atk }] } }

  - id: end_turn
    effects: [ { end_turn: {} } ]

# A Player loses at 0 Life Points or fewer, or on a draw from an empty deck. Both Players losing in
# one transition is a drawn Game. Life Points come first.
win_conditions:
  - id: life_out
    when: { lte: [{ ref: player.life_points }, 0] }
    loser: owner
  - id: deck_out
    when: { draw_from_empty: deck }
    loser: owner
