# The cards of the Duel Ruleset v3 (rulesets/duel-ruleset/duel-ruleset.yaml): sixteen monsters of
# level 1 to 4 (normal summoned), four of level 5 to 6 (one tribute), three of level 7 to 8 (two
# tributes), and three normal spells. Format: rulesets/formats.md.
meta: { ruleset: duel, ruleset_version: 4 }

cards:
  # Level 1.
  - { id: lantern_moth, type: monster, fields: { name: "Lantern Moth", level: 1, atk: 400,  def: 300 } }
  - { id: moss_toad,    type: monster, fields: { name: "Moss Toad",    level: 1, atk: 300,  def: 500 } }
  - { id: ash_sprite,   type: monster, fields: { name: "Ash Sprite",   level: 1, atk: 500,  def: 200 } }

  # Level 2.
  - { id: dusk_raven,    type: monster, fields: { name: "Dusk Raven",    level: 2, atk: 800, def: 400 } }
  - { id: pebble_golem,  type: monster, fields: { name: "Pebble Golem",  level: 2, atk: 700, def: 900 } }
  - { id: reed_stalker,  type: monster, fields: { name: "Reed Stalker",  level: 2, atk: 900, def: 500 } }

  # Level 3.
  - { id: tide_scribe,   type: monster, fields: { name: "Tide Scribe",   level: 3, atk: 1000, def: 1100 } }
  - { id: bramble_wolf,  type: monster, fields: { name: "Bramble Wolf",  level: 3, atk: 1100, def: 800 } }
  - { id: ember_fox,     type: monster, fields: { name: "Ember Fox",     level: 3, atk: 1200, def: 700 } }
  - { id: iron_beetle,   type: monster, fields: { name: "Iron Beetle",   level: 3, atk: 1300, def: 1000 } }
  - { id: gale_hawk,     type: monster, fields: { name: "Gale Hawk",     level: 3, atk: 1400, def: 600 } }

  # Level 4.
  - { id: stone_sentry,  type: monster, fields: { name: "Stone Sentry",  level: 4, atk: 1200, def: 1900 } }
  - { id: frost_warden,  type: monster, fields: { name: "Frost Warden",  level: 4, atk: 1500, def: 1400 } }
  - { id: quarry_bear,   type: monster, fields: { name: "Quarry Bear",   level: 4, atk: 1600, def: 1100 } }
  - { id: cinder_ogre,   type: monster, fields: { name: "Cinder Ogre",   level: 4, atk: 1700, def: 900 } }
  - { id: thorn_knight,  type: monster, fields: { name: "Thorn Knight",  level: 4, atk: 1800, def: 1200 } }

  # Level 5 and 6: one tribute.
  - { id: ashen_minotaur, type: monster, fields: { name: "Ashen Minotaur", level: 5, atk: 2000, def: 1600 } }
  - { id: tempest_roc,    type: monster, fields: { name: "Tempest Roc",    level: 5, atk: 2100, def: 1300 } }
  - { id: obsidian_golem, type: monster, fields: { name: "Obsidian Golem", level: 6, atk: 2300, def: 2000 } }
  - { id: dune_wyrm,      type: monster, fields: { name: "Dune Wyrm",      level: 6, atk: 2400, def: 1700 } }

  # Level 7 and 8: two tributes.
  - { id: abyss_leviathan, type: monster, fields: { name: "Abyss Leviathan", level: 7, atk: 2600, def: 2200 } }
  - { id: sun_colossus,    type: monster, fields: { name: "Sun Colossus",    level: 7, atk: 2800, def: 2100 } }
  - { id: storm_titan,     type: monster, fields: { name: "Storm Titan",     level: 8, atk: 3000, def: 2500 } }

  # Normal spells (ADR-0044): each one's `enter` trigger sends it to the Graveyard first, then does its
  # effect. Breaking Bolt asks its controller for the monster, and does nothing more when the opponent
  # has none.
  - id: breaking_bolt
    type: spell
    fields: { name: "Breaking Bolt" }
    effects:
      - on: { enter: spell_trap_zone }
        do:
          - move: { card: { ref: self }, to: graveyard }
          - choose_card: { name: victim, decider: controller, zone: monster_zone, card_type: monster, owner: opponent }
          - move: { card: { ref: victim }, to: graveyard }
  - id: lucky_find
    type: spell
    fields: { name: "Lucky Find" }
    effects:
      - on: { enter: spell_trap_zone }
        do:
          - move: { card: { ref: self }, to: graveyard }
          - draw: { player: controller, from: deck, to: hand, count: 2 }
  - id: mending_light
    type: spell
    fields: { name: "Mending Light" }
    effects:
      - on: { enter: spell_trap_zone }
        do:
          - move: { card: { ref: self }, to: graveyard }
          - add_state: { player: controller, state: life_points, amount: 1000 }
