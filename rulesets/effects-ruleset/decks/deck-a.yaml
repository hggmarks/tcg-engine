# Sample deck A for the Effects Ruleset: 1 Leader, 50 creatures (at most 4 of each), 10 mana. It
# plays the three families of Card Effects: triggered (lamp_keeper, dawn_scout, grave_jackal,
# eager_recruit, pyre_imp), self-continuous (battle_veteran, weary_ox) and aura (banner_bearer,
# rally_captain).
# Format: rulesets/formats.md.

inputs:
  - input: leader
    cards:
      - { card: captain_ardel, count: 1 }
  - input: main_deck
    cards:
      - { card: goblin_scout,   count: 4 }
      - { card: moss_sprite,    count: 4 }
      - { card: ember_hound,    count: 4 }
      - { card: river_otter,    count: 4 }
      - { card: stone_golem,    count: 4 }
      - { card: shadow_cat,     count: 4 }
      - { card: iron_guard,     count: 2 }
      - { card: wind_hawk,      count: 2 }
      - { card: lamp_keeper,    count: 4 }
      - { card: dawn_scout,     count: 4 }
      - { card: grave_jackal,   count: 2 }
      - { card: eager_recruit,  count: 2 }
      - { card: battle_veteran, count: 2 }
      - { card: weary_ox,       count: 2 }
      - { card: pyre_imp,       count: 2 }
      - { card: banner_bearer,  count: 2 }
      - { card: rally_captain,  count: 2 }
  - input: mana_deck
    cards:
      - { card: mana, count: 10 }
