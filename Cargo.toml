[workspace]
members = ["crates/tcg-loader", "crates/tcg-selfplay"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"
float_arithmetic = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "tcg-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true

# The observation checks of tcg-selfplay (ADR-0031) replay the whole Game at every step, which made
# the debug test run slow. Only the optimisation level of the two crates changes, and only under
# `cargo test`; overflow-checks stays on at the profile level.
[profile.test.package.tcg-engine]
opt-level = 2

[profile.test.package.tcg-selfplay]
opt-level = 2
