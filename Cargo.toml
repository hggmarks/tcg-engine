[workspace]
members = ["crates/tcg-loader"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"
float_arithmetic = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "tcg-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
